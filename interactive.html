<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска-менажница — интерактивный дизайн</title>
<style>
  /* --- темы через prefers-color-scheme --- */
  :root {
    --bg:#f4f1ea; --panel:#ffffff; --panel2:#eef0f4; --text:#1d2433;
    --muted:#7a8499; --accent:#2f6fed; --border:#d9dee8;
    --ok:#1f9d55; --bad:#d33; --pre:#0f172a; --pre-text:#e6ebf5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#161b26; --panel:#1f2636; --panel2:#262e41; --text:#e8ecf4;
      --muted:#9aa4b8; --accent:#4da3ff; --border:#3a4358;
      --ok:#2fbf6f; --bad:#ff5b5b; --pre:#0b1020; --pre-text:#dfe6f3;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { display:flex; gap:18px; padding:18px; min-height:100vh; }
  .controls { flex:0 0 360px; overflow-y:auto; max-height:100vh; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px;
           padding:14px 16px; margin-bottom:14px; }
  .panel h2 { font-size:15px; margin:0 0 4px; }
  .panel .sub { font-size:12px; color:var(--muted); margin-bottom:10px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .headline { color:var(--muted); font-size:12px; margin-bottom:14px; }

  /* --- галерея --- */
  .gallery { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .tile { border:2px solid var(--border); border-radius:8px; padding:4px; cursor:pointer;
          background:var(--panel2); text-align:center; }
  .tile img { width:100%; display:block; border-radius:5px; }
  .tile .t { font-size:11px; margin-top:3px; }
  .tile.sel { border-color:var(--accent); }

  /* --- ползунки --- */
  .ctrl { margin-bottom:12px; }
  .ctrl label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; }
  .ctrl label b { color:var(--accent); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }

  /* --- порода --- */
  select { width:100%; padding:7px; border:1px solid var(--border); border-radius:7px;
           background:var(--panel2); color:var(--text); font-size:13px; }
  .woodcard { margin-top:9px; font-size:12px; line-height:1.45; background:var(--panel2);
              border-radius:8px; padding:9px 11px; }
  .woodcard .row { display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); }
  .woodcard b { color:var(--text); }

  /* --- фрезы --- */
  .bit { display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--border); }
  .bit:last-child { border-bottom:0; }
  .bit input { margin-top:3px; accent-color:var(--accent); }
  .bit .swatch { width:14px; height:14px; border-radius:3px; flex:0 0 14px; margin-top:3px; }
  .bit .meta { font-size:11px; color:var(--muted); }
  .bit .note { font-size:12px; color:var(--text); }
  .bit .ttl { font-size:13px; font-weight:600; }
  .bitrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .bitrow a { font-size:12px; color:var(--accent); cursor:pointer; }

  /* --- превью --- */
  .preview { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .frame { flex:1; display:flex; align-items:center; justify-content:center;
           background:var(--panel); border:1px solid var(--border); border-radius:12px;
           padding:10px; position:relative; min-height:320px; }
  .frame img { max-width:100%; max-height:calc(100vh - 160px); }
  .spinner { display:none; position:absolute; inset:0; align-items:center; justify-content:center;
             background:rgba(0,0,0,.25); border-radius:12px; }
  .spinner.on { display:flex; }
  .spin { width:34px; height:34px; border:3px solid #fff6; border-top-color:#fff;
          border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  button { width:100%; padding:12px; font-size:15px; font-weight:600; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:progress; }
  .banner { display:none; margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:600; }
  .banner.ok { display:block; background:var(--ok); color:#fff; }
  .banner.bad { display:block; background:var(--bad); color:#fff; }
  pre { background:var(--pre); color:var(--pre-text); border-radius:8px; padding:12px;
        font-size:11px; max-height:300px; overflow:auto; white-space:pre-wrap; margin:0; }
  .files { margin-top:10px; }
  .files a { display:block; font-size:12px; color:var(--accent); text-decoration:none; padding:3px 0; }
  .files a small { color:var(--muted); }
  .err { color:var(--bad); font-size:12px; margin-top:8px; white-space:pre-wrap; }
  .empty { font-size:12px; color:var(--muted); }

  /* --- адаптив: на узких экранах колонка --- */
  @media (max-width:720px) {
    .wrap { flex-direction:column; padding:10px; }
    .controls { flex:none; max-height:none; overflow:visible; }
    .frame img { max-height:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <h1>Доска-менажница</h1>
    <div class="headline">вертушка · всё в миллиметрах · v{{VERSION}}</div>

    <div class="panel">
      <h2>Раскладка</h2>
      <div class="sub">клик по плитке — подставит параметры</div>
      <input type="hidden" id="LAYOUT_HIDDEN" value="spiral">
      <div class="gallery" id="gallery"><span class="empty" id="gallery-empty">загружаю…</span></div>
    </div>

    <div class="panel">
      <h2>Заготовка</h2>
      <div class="ctrl"><label>Сторона квадрата <b id="v-BLANK_SIZE"></b></label>
        <input type="range" id="BLANK_SIZE" min="250" max="800" step="5" value="430"></div>
      <div class="ctrl"><label>Толщина заготовки <b id="v-BLANK_THICK"></b></label>
        <input type="range" id="BLANK_THICK" min="15" max="60" step="1" value="25"></div>
    </div>

    <div class="panel">
      <h2>Изделие</h2>
      <div class="ctrl"><label>Диаметр <b id="v-BOARD_DIA"></b></label>
        <input type="range" id="BOARD_DIA" min="250" max="500" step="2" value="406"></div>
      <div class="ctrl"><label>Высота доски <b id="v-THICK"></b></label>
        <input type="range" id="THICK" min="15" max="60" step="1" value="25"></div>
      <div class="ctrl"><label>Глубина отсека <b id="v-POCKET_DEPTH"></b></label>
        <input type="range" id="POCKET_DEPTH" min="5" max="15.5" step="0.5" value="12"></div>
      <div class="ctrl"><label>Бортик <b id="v-RIM_W"></b></label>
        <input type="range" id="RIM_W" min="10" max="60" step="1" value="25"></div>
      <div class="ctrl"><label>Число отсеков <b id="v-N_POCKETS"></b></label>
        <input type="range" id="N_POCKETS" min="3" max="8" step="1" value="3"></div>
    </div>

    <div class="panel">
      <h2>Вертушка</h2>
      <div class="ctrl"><label>Закрутка стенки <b id="v-SPIRAL_SWEEP"></b></label>
        <input type="range" id="SPIRAL_SWEEP" min="0" max="260" step="2" value="200"></div>
      <div class="ctrl"><label>Радиус втулки <b id="v-HUB_R"></b></label>
        <input type="range" id="HUB_R" min="15" max="60" step="1" value="30"></div>
      <div class="ctrl"><label>Толщина стенки <b id="v-WALL_W"></b></label>
        <input type="range" id="WALL_W" min="6" max="30" step="0.5" value="12"></div>
      <div class="ctrl"><label>Скругление стыков <b id="v-CORNER_F"></b></label>
        <input type="range" id="CORNER_F" min="10" max="25" step="0.5" value="14"></div>
    </div>

    <div class="panel">
      <h2>Порода</h2>
      <select id="WOOD"></select>
      <div class="woodcard" id="woodcard" style="display:none"></div>
    </div>

    <div class="panel">
      <div class="bitrow">
        <h2>Фрезы</h2>
        <a id="bits-all">выбрать все</a>
      </div>
      <div class="sub">галками управляются траектории на превью</div>
      <div id="bits"><span class="empty" id="bits-empty">загружаю…</span></div>
    </div>

    <button id="gen">Сгенерировать G-code</button>
    <div class="banner" id="banner"></div>
    <div class="files" id="files"></div>
    <pre id="report" style="display:none"></pre>
    <div class="err" id="err"></div>
  </div>

  <div class="preview">
    <div class="frame">
      <img id="img" src="/preview.svg" alt="превью">
      <div class="spinner" id="spinner"><div class="spin"></div></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Параметры и состояние. Слайдеры в мм, SPIRAL_SWEEP в градусах, WOOD — строка.
   ===================================================================== */
const SLIDERS = ['BLANK_SIZE','BLANK_THICK','BOARD_DIA','THICK','POCKET_DEPTH','RIM_W',
                 'N_POCKETS','SPIRAL_SWEEP','HUB_R','WALL_W','CORNER_F'];
const DEG = new Set(['SPIRAL_SWEEP']);
const COUNT = new Set(['N_POCKETS']);   // безразмерные: штуки

const $ = id => document.getElementById(id);
const el = id => $(id);                       // слайдер/селект
const img = $('img'), spinnerEl = $('spinner');

let previewTimer = null;   // дебаунс формы (150 мс)
let pathsTimer = null;     // дебаунс траекторий (400 мс)
let pathsLoading = false;  // не слать /paths.svg, пока идёт предыдущий
let pathsDirty = false;    // пришёл запрос, пока грузился — повторить после

/* ---------------------------------------------------------------------
   Мелкие утилиты
   --------------------------------------------------------------------- */
function err(msg) {
  const e = $('err');
  if (msg) { e.textContent = msg; } else { e.textContent = ''; }
}
function spinner(on) { spinnerEl.classList.toggle('on', !!on); }

// Запросить URL и обработать ошибку; тело как текст.
async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------------------------------------------------------------------
   Форма: ползунки -> /preview.svg (быстро) и /paths.svg (если есть галки)
   --------------------------------------------------------------------- */
function currentQuery() {
  const q = new URLSearchParams();
  for (const p of SLIDERS) q.set(p, el(p).value);
  q.set('WOOD', el('WOOD').value || 'maple');
  q.set('LAYOUT', el('LAYOUT_HIDDEN').value || 'spiral');
  return q.toString();
}
function checkedBits() {
  return [...document.querySelectorAll('.bit-cb:checked')].map(cb => cb.value);
}

// Показать картинку; done() вызывается по завершении загрузки.
function setImg(url, done) {
  let finished = false;
  const fin = (ok) => {
    if (finished) return;
    finished = true;
    spinner(false);
    if (!ok) err('Не удалось загрузить превью');
    if (done) done();
  };
  spinner(true);
  img.onload = () => fin(true);
  img.onerror = () => fin(false);
  img.src = url;
}

// Быстрая отрисовка формы (ползунки).
function refreshShape() {
  err('');
  pathsLoading = false;   // прошлый /paths.svg бросаем: его onload уже не сработает
  setImg('/preview.svg?' + currentQuery());
}
// Медленная отрисовка траекторий выбранных фрез (галки).
function refreshPaths() {
  if (pathsLoading) { pathsDirty = true; return; }
  const bits = checkedBits();
  if (!bits.length) { refreshShape(); return; }
  pathsLoading = true;
  err('');
  setImg('/paths.svg?bits=' + bits.join(',') + '&' + currentQuery(), () => {
    pathsLoading = false;
    if (pathsDirty) { pathsDirty = false; refreshPaths(); }
  });
}

SLIDERS.forEach(p => {
  const inp = el(p);
  inp.addEventListener('input', () => {
    updateLabels();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(refreshShape, 150);
    // если галки выбраны — траектории тоже надо пересчитать, но реже
    clearTimeout(pathsTimer);
    pathsTimer = setTimeout(refreshPaths, 400);
  });
});

function updateLabels() {
  for (const p of SLIDERS) {
    const v = el(p).value;
    const unit = DEG.has(p) ? '°' : (COUNT.has(p) ? ' шт' : ' мм');
    const cm = (p === 'BOARD_DIA' || p === 'BLANK_SIZE') ? ' (' + (v / 10).toFixed(1) + ' см)' : '';
    $('v-' + p).textContent = v + unit + cm;
  }
}

/* ---------------------------------------------------------------------
   Раскладки: /layouts
   --------------------------------------------------------------------- */
async function loadLayouts() {
  try {
    const list = await fetchJSON('/layouts');
    const g = $('gallery');
    g.innerHTML = '';
    if (!list.length) { g.innerHTML = '<span class="empty">раскладок пока нет</span>'; return; }
    for (const L of list) {
      const t = document.createElement('div');
      t.className = 'tile';
      let q = new URLSearchParams();
      q.set('LAYOUT', L.id);
      if (L.defaults) {
          for (const k in L.defaults) q.set(k, L.defaults[k]);
      }
      t.innerHTML = '<img src="/preview.svg?' + q.toString() + '" alt=""><div class="t"></div>';
      t.querySelector('.t').textContent = L.title || L.id;
      t.onclick = () => applyLayout(L);
      g.appendChild(t);
    }
  } catch (e) { $('gallery').innerHTML = '<span class="empty">ошибка: ' + e.message + '</span>'; }
}
function applyLayout(L) {
  if (L.defaults) {
    if (L.defaults.LAYOUT) $('LAYOUT_HIDDEN').value = L.defaults.LAYOUT;
    for (const k in L.defaults) {
      if (!el(k)) continue;
      el(k).value = L.defaults[k];
      // ползунок молча зажимает значение своим min/max - тогда превью покажет
      // не ту раскладку, по которой кликнули
      if (Number(el(k).value) !== Number(L.defaults[k]))
        err('«' + (L.title || L.id) + '»: ' + k + ' = ' + L.defaults[k] +
            ' не влезает в диапазон ползунка (' + el(k).min + '…' + el(k).max +
            '), стоит ' + el(k).value);
    }
  }
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('sel'));
  updateLabels();
  refreshShape();
}

/* ---------------------------------------------------------------------
   Порода: /woods
   --------------------------------------------------------------------- */
async function loadWoods() {
  const sel = $('WOOD');
  sel.innerHTML = '';
  try {
    const list = await fetchJSON('/woods');
    window._woods = list;
    for (const w of list) {
      const o = document.createElement('option');
      o.value = w.id;
      o.textContent = (w.title || w.id);
      sel.appendChild(o);
    }
    sel.value = 'maple';
    sel.addEventListener('change', () => { showWood(); refreshShape(); });
    showWood();
  } catch (e) {
    sel.innerHTML = '<option value="maple">maple</option>';
    err('Породы не загрузились: ' + e.message);
  }
}
function showWood() {
  if (!window._woods) return;
  const w = window._woods.find(x => x.id === $('WOOD').value);
  const c = $('woodcard');
  if (!w) { c.style.display = 'none'; return; }
  c.style.display = 'block';
  c.innerHTML =
    '<div class="row"><span><b>Janka</b> ' + (w.janka ? '~' + w.janka : '—') + '</span>' +
    '<span><b>подача</b> ×' + (w.scale != null ? w.scale.toFixed(2) : '—') + '</span>' +
    '<span><b>обороты</b> ' + (w.rpm != null ? w.rpm : '—') + '</span>' +
    '<span><b>Makita</b> ~' + (w.dial != null ? w.dial : '—') + '</span></div>' +
    '<div>' + (w.hint || w.note || '') + '</div>';
}

/* ---------------------------------------------------------------------
   Фрезы: /bits
   --------------------------------------------------------------------- */
async function loadBits() {
  const box = $('bits');
  box.innerHTML = '';
  try {
    const list = await fetchJSON('/bits');
    window._bits = list;
    if (!list.length) { box.innerHTML = '<span class="empty">фрез пока нет</span>'; return; }
    for (const b of list) {
      const d = document.createElement('div');
      d.className = 'bit';
      d.innerHTML =
        '<input type="checkbox" class="bit-cb" value="' + b.id + '">' +
        '<span class="swatch" style="background:' + (b.color || '#999') + '"></span>' +
        '<span><div class="ttl">' + (b.title || b.id) + '</div>' +
        '<div class="meta">D' + b.dia + ' мм · ' + b.rpm + ' об/мин · подача ' + b.feed +
        ' · глубина ' + b.doc + ' мм</div>' +
        '<div class="note">' + (b.note || '') + '</div></span>';
      box.appendChild(d);
    }
    box.querySelectorAll('.bit-cb').forEach(cb => cb.addEventListener('change', () => {
      clearTimeout(pathsTimer);
      pathsTimer = setTimeout(refreshPaths, 400);
    }));
    $('bits-all').onclick = () => {
      const all = box.querySelectorAll('.bit-cb');
      const none = [...all].every(cb => cb.checked);
      all.forEach(cb => cb.checked = !none);
      refreshPaths();
    };
  } catch (e) { box.innerHTML = '<span class="empty">ошибка: ' + e.message + '</span>'; }
}

/* ---------------------------------------------------------------------
   Генерация G-code
   --------------------------------------------------------------------- */
$('gen').addEventListener('click', async () => {
  const btn = $('gen'), banner = $('banner'), files = $('files'), rep = $('report');
  btn.disabled = true; btn.textContent = 'Идёт расчёт, до минуты…';
  banner.className = 'banner'; files.innerHTML = ''; rep.style.display = 'none'; err('');
  try {
    const data = await fetchJSON('/generate?' + currentQuery());
    rep.textContent = data.report;
    rep.style.display = 'block';
    // баннер по итогу
    const ok = data.ok;
    banner.className = 'banner ' + (ok ? 'ok' : 'bad');
    banner.textContent = ok ? 'ГОТОВО — В ПОРЯДКЕ' : 'НА СТАНОК НЕ НЕСТИ — ЕСТЬ ЗАМЕЧАНИЯ';
    // файлы + zip
    let html = '';
    for (const f of data.files || []) {
      html += '<a href="' + f.url + '">' + f.name +
        ' <small>(' + (f.size / 1024).toFixed(1) + ' КБ, ~' + f.minutes + ' мин)</small></a>';
    }
    html += '<a href="/nc.zip"><b>Скачать все (nc.zip)</b></a>';
    files.innerHTML = html;
  } catch (e) {
    err('Генерация не удалась: ' + e.message);
    banner.className = 'banner bad';
    banner.textContent = 'ОШИБКА ГЕНЕРАЦИИ';
  } finally {
    btn.disabled = false; btn.textContent = 'Сгенерировать G-code';
  }
});

/* ---------------------------------------------------------------------
   Старт
   --------------------------------------------------------------------- */
updateLabels();
loadLayouts();
loadWoods();
loadBits();
refreshShape();
</script>
</body>
</html>
